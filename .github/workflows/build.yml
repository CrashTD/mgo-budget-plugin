name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 clang-tidy wine64 zip
          pip install clang-format==19.1.7
      - name: Format check
        run: make format-check
      - name: Static analysis
        run: make tidy
      - name: Build
        run: make
      - name: Test under Wine
        run: make test WINE=wine64
      - name: Package
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: MGOBudgetPlugin
          path: MGOBudgetPlugin-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MGOBudgetPlugin-*.zip
          body_path: CHANGELOG.md
