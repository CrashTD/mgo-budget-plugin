; MGO Budget Plugin settings. Everything only takes effect under Wine/Proton.

[DXVK]
; Appended to DXVK_CONFIG before the game starts its renderer (later entries win).
; Replaces DXVK_CONFIG in the launch options. 13500 is the ceiling on a 16 GB card.
Config=dxvk.maxMemoryBudget=13500;d3d11.cachedDynamicResources=c

[Budget]
; Memory budget in MiB that Community Shaders sees for its VR render scale check (0 = off).
MiB=24000

[Controller]
; Quest headsets via WiVRn/xrizer only: report idle controllers (generic profile) as Oculus
; Touch so VRIK does not set up Vive Wands. Off by default; Quest owners set 1. Stays off if
; the headset clearly reports another vendor.
QuestFixGenericProfile=0

[Check]
; Health check at startup, results in MGOBudgetPlugin.log (lines with [check]).
Enabled=1

[DevBench]
; Only with the DevBench SKSE plugin installed: registers the tools mgobudget.status and
; mgobudget.set (budget live) with its local endpoint, e.g.
; curl -X POST 127.0.0.1:8921/api/tool/mgobudget.status. Does nothing without DevBench.
Enabled=1
